name: "Draft release"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package for draft release"
        required: true
        default: "webrtc"
      ref:
        description: "Git ref (branch or tag) to draft from"
        required: false
        default: "main"
      prerelease:
        description: "Pre-release identifier"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
      increment:
        description: "Version bump (only if prerelease is 'none')"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version to release, e.g. 3.0.0 (overrides increment; leave empty to use increment)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  PACKAGE_DIR: ${{ github.event.inputs.package == 'webrtc' && 'js' || github.event.inputs.package }}

jobs:
  draft:
    if: contains(fromJson('["webrtc", "react-client"]'), github.event.inputs.package)

    name: "@telnyx/${{ github.event.inputs.package }} Draft release"

    runs-on: ubuntu-latest

    env:
      TARGET_REF: ${{ github.event.inputs.ref || 'main' }}
      PRERELEASE_ARGS: ${{ github.event.inputs.prerelease && github.event.inputs.prerelease != 'none' && format(' --preRelease={0} --github.preRelease', github.event.inputs.prerelease) || '' }}
      INCREMENT_ARG: ${{ github.event.inputs.version && format(' --increment={0}', github.event.inputs.version) || github.event.inputs.prerelease && github.event.inputs.prerelease != 'none' && ' --increment=prerelease' || github.event.inputs.increment && format(' --increment={0}', github.event.inputs.increment) || '' }}
      VERSION_INPUT: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Use Node.js 24.5
        uses: actions/setup-node@v6
        with:
          node-version: "24.5.0"
          cache: "yarn"
          registry-url: https://registry.npmjs.org/

      - name: Install shared dependencies
        run: yarn install --immutable

      - name: Install package dependencies
        working-directory: packages/${{ env.PACKAGE_DIR }}
        run: yarn install --immutable

      - name: Test
        working-directory: packages/${{ env.PACKAGE_DIR }}
        run: yarn test
        env:
          CI: true

      - name: Determine next version
        id: version
        working-directory: packages/${{ env.PACKAGE_DIR }}
        run: |
          if [ -n "$VERSION_INPUT" ] && ! [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The version input must look like 3.0.0 or 3.0.0-beta.0"
            exit 1
          fi
          # --no-npm.publish skips release-it's npm login check (npm publishing happens in publish-release.yml).
          NEXT=$(yarn release --ci --release-version --no-npm.publish $INCREMENT_ARG $PRERELEASE_ARGS)
          # release-it returns the version input as-is when it is >= the current version (and null when lower).
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$VERSION_INPUT" ] && { [ "$NEXT" != "$VERSION_INPUT" ] || [ "$NEXT" = "$CURRENT_VERSION" ]; }; then
            echo "::error::The version input must be higher than the current version ${CURRENT_VERSION}"
            exit 1
          fi
          TAG="${{ github.event.inputs.package }}/v${NEXT}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists; set the version input to an unused version"
            exit 1
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "branch=release/${{ github.event.inputs.package }}-v$NEXT" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        id: changelog
        working-directory: packages/${{ env.PACKAGE_DIR }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          PACKAGE="${{ github.event.inputs.package }}"
          DATE=$(date +%Y-%m-%d)
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Only list commits that touch this package (paths are relative to the repo root).
          # The webrtc notes also cover the root docs/ folder, which holds the SDK's network guide.
          LOG_PATHS=(":(top)packages/${PACKAGE_DIR}")
          if [ "$PACKAGE" = "webrtc" ]; then
            LOG_PATHS+=(":(top)docs")
          fi

          # List changes since the tag of the current version. A release published without a tag
          # (react-client 1.0.2) starts from the commit that set package.json to that version.
          LAST_TAG="${PACKAGE}/v${CURRENT_VERSION}"
          BASE="$LAST_TAG"
          if ! git rev-parse --verify --quiet "refs/tags/${LAST_TAG}^{commit}" >/dev/null; then
            BASE=$(git log -1 --format=%H -S"\"version\": \"${CURRENT_VERSION}\"" -- package.json)
            if [ -n "$BASE" ]; then
              echo "::warning::Expected previous release tag ${LAST_TAG} was not found; listing changes since ${BASE}, which set version ${CURRENT_VERSION}"
            else
              echo "::warning::Expected previous release tag ${LAST_TAG} was not found, nor the commit that set version ${CURRENT_VERSION}"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          if [ -n "$BASE" ]; then
            NOTES=$(git log "${BASE}..HEAD" --pretty=format:'- %s' -- "${LOG_PATHS[@]}" | grep -i -E '^- (feat|fix|docs|refactor|chore)' | grep -vi -E '^- chore: release ' || true)
            COMPARE="[${VERSION}](https://github.com/${{ github.repository }}/compare/${BASE}...${PACKAGE}/v${VERSION})"
          else
            # Nothing to start from: link to the package history instead of listing every commit.
            NOTES="- See the [commit history](https://github.com/${{ github.repository }}/commits/${PACKAGE}/v${VERSION}/packages/${PACKAGE_DIR}) for the changes in this release."
            COMPARE="${VERSION}"
          fi

          if [ -n "$NOTES" ]; then
            ENTRY=$(printf '## %s (%s)\n\n%s\n\n' "$COMPARE" "$DATE" "$NOTES")
          else
            ENTRY=$(printf '## %s (%s)\n\n- No notable changes\n\n' "$COMPARE" "$DATE")
          fi

          if [ -f CHANGELOG.md ]; then
            printf '%s\n%s' "$ENTRY" "$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            printf '%s' "$ENTRY" > CHANGELOG.md
          fi

          git add CHANGELOG.md

      - name: Create release branch
        run: |
          git checkout -b "${{ steps.version.outputs.branch }}"

      - name: Commit CHANGELOG.md
        run: |
          git commit -m "chore: update changelog for ${{ github.event.inputs.package }}@${{ steps.version.outputs.next }}" || echo "changelog: no changes to commit"

      - name: Create draft release (bump + tag + draft)
        working-directory: packages/${{ env.PACKAGE_DIR }}
        run: |
          yarn release --ci --github.draft --no-npm.publish --no-git.push --no-git.requireUpstream $INCREMENT_ARG $PRERELEASE_ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release branch and tag
        run: |
          git push origin "${{ steps.version.outputs.branch }}" --follow-tags

      - name: Pin draft release target to bump commit SHA
        run: |
          # Pin the draft's target_commitish to the exact bump commit SHA so
          # publishing the draft does NOT force-move the tag when the release
          # branch is later deleted (GitHub falls back to the default branch
          # otherwise, moving the tag away from the version-bump commit).
          # Must run AFTER the push so the SHA exists on origin, otherwise
          # the GitHub API rejects it with 422 "target_commitish is invalid".
          BUMP_SHA=$(git rev-parse HEAD)
          TAG="${{ github.event.inputs.package }}/v${{ steps.version.outputs.next }}"
          gh release edit "$TAG" --target "$BUMP_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append full changelog link to draft release
        if: steps.changelog.outputs.base != ''
        run: |
          TAG="${{ github.event.inputs.package }}/v${{ steps.version.outputs.next }}"
          BASE="${{ steps.changelog.outputs.base }}"
          CHANGELOG_LINK="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${BASE}...${TAG}"
          CURRENT_BODY=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || echo "")
          gh release edit "$TAG" --notes "${CURRENT_BODY}

          ${CHANGELOG_LINK}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        run: |
          gh pr create \
            --title "chore: release ${{ github.event.inputs.package }}@${{ steps.version.outputs.next }}" \
            --body "## Release ${{ github.event.inputs.package }}@${{ steps.version.outputs.next }}

          Automated release PR created by the draft-release workflow.

          - Version bump in \`package.json\`
          - Updated \`CHANGELOG.md\`
          - Draft GitHub release created

          **After merging**, publish the release from the [releases page](https://github.com/${{ github.repository }}/releases)." \
            --base "${{ env.TARGET_REF }}" \
            --head "${{ steps.version.outputs.branch }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
